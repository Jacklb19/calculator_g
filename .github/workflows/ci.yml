name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          # No third-party modules, so there is no go.sum to key a cache on.
          cache: false

      - name: Lint
        run: make lint-backend

      - name: Test with coverage
        run: make coverage-backend GOTESTFLAGS=-race

      - name: Coverage summary
        run: |
          {
            echo '### Backend coverage'
            echo '```'
            cd backend && go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.out

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: make install

      - name: Lint and type check
        run: make lint-frontend

      - name: Test with coverage
        run: make coverage-frontend | tee coverage-summary.txt

      - name: Coverage summary
        run: |
          {
            echo '### Frontend coverage'
            echo '```'
            grep -E '^(Statements|Branches|Functions|Lines)' coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage

  docker:
    name: Docker image
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: calculator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run --detach --name calculator --publish 8080:8080 calculator:ci

      - name: Smoke test
        run: make smoke

      - name: Container logs
        if: always()
        run: docker logs calculator
